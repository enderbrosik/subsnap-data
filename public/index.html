<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubSnap</title>
  <style>
    :root { color-scheme: light dark; --bg: #fbfbfa; --fg: #1d1d1f; --muted: #6b6b70; --accent: #2a5bd7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #ececee; --muted: #9a9aa2; --accent: #8aa9ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 0 16px; }
    h1 { margin: 0 0 8px; font-size: 2.4rem; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>SubSnap</h1>
    <p><a href="/data/">Service and price data</a></p>
  </main>
</body>
</html>
